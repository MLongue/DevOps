name: CI Pipeline - DevOps Fase 1

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint, Testes e Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar padrão de código (Flake8)
        run: flake8 app tests --max-line-length=100

      - name: Rodar testes automatizados (Pytest)
        run: pytest -v

      - name: Testar build da imagem Docker
        run: docker build -t taskflow-api:ci-test .

  validate-iac:
    name: Validar Scripts Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Checar formatação dos arquivos .tf
        working-directory: ./infra
        run: terraform fmt -check

      - name: Validar sintaxe e configuração
        working-directory: ./infra
        run: |
          terraform init -backend=false
          terraform validate
